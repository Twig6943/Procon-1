app-id: io.github.AdKats.PRoCon
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.dotnet10
command: PRoCon.UI
finish-args:
- --share=ipc
- --socket=x11
- --socket=wayland
- --device=dri
- --share=network
- --env=DOTNET_ROOT=/app/lib/dotnet
build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    NUGET_PACKAGES: /run/build/procon.ui/nuget-cache
  arch:
    aarch64:
      env:
        RUNTIME: linux-arm64
    x86_64:
      env:
        RUNTIME: linux-x64
modules:
- name: dotnet
  buildsystem: simple
  build-commands:
  - /usr/lib/sdk/dotnet10/bin/install.sh
  - install -Dm644 /usr/lib/sdk/dotnet10/share/licenses/org.freedesktop.Sdk.Extension.dotnet10/dotnet-sdk/LICENSE.txt
    /app/share/licenses/io.github.AdKats.PRoCon/dotnet/LICENSE.txt
- name: procon.ui
  buildsystem: simple
  build-commands:
  - |-
    dotnet publish PRoCon.UI/PRoCon.UI.csproj \
      -c Release -r $RUNTIME --no-self-contained \
      -p:PublishSingleFile=false -p:NuGetAudit=false \
      --source ./nuget-sources \
      --source /usr/lib/sdk/dotnet10/nuget/packages \
      -o ${FLATPAK_DEST}/bin
  - install -Dm644 procon.desktop ${FLATPAK_DEST}/share/applications/io.github.AdKats.PRoCon.desktop
  - sed -i 's/^Icon=procon$/Icon=io.github.AdKats.PRoCon/' ${FLATPAK_DEST}/share/applications/io.github.AdKats.PRoCon.desktop
  - install -Dm644 procon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.AdKats.PRoCon.png
  - install -Dm644 io.github.AdKats.PRoCon.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.AdKats.PRoCon.metainfo.xml
  sources:
  - type: dir
    path: ../../..
  - type: file
    path: ../procon.desktop
    dest-filename: procon.desktop
  - type: file
    path: ../../procon.png
    dest-filename: procon.png
  - type: file
    path: io.github.AdKats.PRoCon.metainfo.xml
  - nuget-sources.json
