name: Build Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed flatpak flatpak-builder make

      - name: Download SDK
        run: |
          flatpak install --user --noninteractive --assumeyes flathub \
          org.freedesktop.Platform//26.08 \
          org.freedesktop.Sdk.Extension.dotnet10

      - name: Build Flatpak
        run: |
          make regenerate-sources
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo \
            flatpak-build-dir \
            src/PRoCon.UI/packaging/flatpak/io.github.AdKats.PRoCon.yml

      - name: Create Flatpak bundle
        run: |
          mkdir -p src/PRoCon.UI/packaging/flatpak/dist
          flatpak build-bundle flatpak-repo \
            src/PRoCon.UI/packaging/flatpak/dist/PRoCon.flatpak \
            io.github.AdKats.PRoCon

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flatpak
          path: src/PRoCon.UI/packaging/flatpak/dist/*.flatpak
          archive: false
